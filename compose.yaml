services:
  localstack:
    image: localstack/localstack:latest
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Configura el token en .env}
      SERVICES: s3,sqs,dynamodb
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
      DEBUG: "0"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
  web:
    build: .
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      ADMIN_USER: ${ADMIN_USER:?Configura ADMIN_USER en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en .env}
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8000"
